services:
  postgres:
    image: postgres:16
    container_name: bigdata-spark-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigdata_spark}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
      - "./исходные данные:/data:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigdata} -d ${POSTGRES_DB:-bigdata_spark}"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: bigdata-spark-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: bigdata-spark-spark
    environment:
      SPARK_MODE: master
      SPARK_MASTER_PORT: ${SPARK_MASTER_PORT:-7077}
      SPARK_UI_PORT: ${SPARK_UI_PORT:-8080}
      POSTGRES_DB: ${POSTGRES_DB:-bigdata_spark}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  pgdata:
  chdata:
